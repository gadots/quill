name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # quill targets macOS 15 and uses Core Audio process taps, so the build
    # needs a macOS 15 runner — there is no cross-compilation story here.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Package.resolved is committed, so the cache key is exact: a hit means
      # the same dependency revisions, not just the same manifest.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
